<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Leashless</title>
<meta name="apple-itunes-app" content="app-id=6824555707">
<style>
  :root { --bg: #ffffff; --text: #1c1c1e; --muted: #5b5b60; --line: #e2e2e6; --link: #b02a3a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141416; --text: #f2f2f4; --muted: #b0b0b6; --line: #2e2e33; --link: #f2737a; }
  }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.9rem; line-height: 1.2; margin: 0 0 8px; }
  h2 { font-size: 1.25rem; line-height: 1.3; margin: 36px 0 8px; padding-top: 20px; border-top: 1px solid var(--line); }
  p, ul, ol { margin: 0 0 14px; }
  ul, ol { padding-left: 1.2em; }
  li { margin-bottom: 6px; }
  a { color: var(--link); }
  .muted { color: var(--muted); font-size: 0.95rem; }
  nav { font-size: 0.95rem; margin-bottom: 24px; }
</style>
</head>
<body>
<main>
<h1>Leashless</h1>
<p>Leashless is a free iPhone app that runs AI chat entirely on your phone, with no accounts, ads or tracking.</p>
<p><strong><a href="https://apps.apple.com/app/leashless/id6824555707">Download Leashless on the App Store</a></strong></p>
<p><a href="privacy.html">Privacy Policy</a> · <a href="support.html">Support</a> · <a href="terms.html">Web Search Terms</a></p>
</main>
</body>
</html>
